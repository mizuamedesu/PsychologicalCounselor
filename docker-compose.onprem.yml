services:
  codex-runner:
    build:
      context: .
      dockerfile: runner/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8789:8789"
    environment:
      PORT: "8789"
      HOME: /home/codex
      CODEX_HOME: /home/codex/.codex
      WORKSPACE_DIR: /workspace
      RUNNER_SHARED_SECRET: ${RUNNER_SHARED_SECRET}
      CODEX_MODEL: ${CODEX_MODEL:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_STATE_PREFIX: ${R2_STATE_PREFIX:-codex-state/main}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - codex-workspace:/workspace
      - ${HOST_CODEX_HOME:-./.codex-state}:/home/codex/.codex

  discord-bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    restart: unless-stopped
    depends_on:
      - codex-runner
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      WORKER_DM_URL: ${WORKER_DM_URL:-https://psychological-counselor.fasutotesuto.workers.dev/dm}
      WORKER_PROACTIVE_URL: ${WORKER_PROACTIVE_URL:-https://psychological-counselor.fasutotesuto.workers.dev/proactive}
      PROACTIVE_POLL_INTERVAL_MS: ${PROACTIVE_POLL_INTERVAL_MS:-300000}
      RUNNER_SHARED_SECRET: ${RUNNER_SHARED_SECRET}

volumes:
  codex-workspace:
